# Configuration for the autonomous NSE momentum paper-trading system.
#
# THIS FILE IS THE TEMPLATE, NOT YOUR LIVE CONFIG.
# The app actually reads two things, both gitignored (see .gitignore),
# both created automatically the first time they don't exist:
#   - config.yaml (a sibling of this file): the shared/global settings
#     below (universe, market hours, data source, logging, ...) that
#     aren't specific to any one profile.
#   - profiles/<name>.yaml (one file per profile, in a `profiles/`
#     directory next to this one): each profile's own display_name,
#     category, state_file, starting_capital, strategy_mode,
#     universe_file/regime overrides, and its own strategy:/risk: blocks
#     -- split out of the `profiles:` section below, one file per entry.
# From then on both are yours: dashboard edits, hand edits, anything you
# change there is permanent and `git pull` will never touch, overwrite,
# or ask you to discard it, because git no longer tracks either at all.
# A profile's own file is completely independent of every other
# profile's -- editing or even deleting one never touches another.
#
# When a `git pull` updates THIS file with something new (a new profile,
# a new setting on an existing profile), run `python main.py sync-config`
# to safely merge just the new keys into your live config.yaml and/or
# profiles/*.yaml -- it only ever ADDS a key that's missing (or a whole
# new profile file); it never overwrites a value you already have,
# customized or not. Run it any time after pulling; it's a no-op if
# there's nothing new to add.
#
# PROFILE SYSTEM:
# Each profile maintains completely separate positions, cash, and trade history.
# When you switch profiles, you switch to a different ledger and strategy.
#
# - 52w_high: Your primary account (existing trades preserved here)
# - cross_sectional: Independent copy of capital for cross-sectional momentum
# - consolidation_breakout: Independent copy of capital for consolidation breakout
# - pivot_supertrend: Independent copy of capital for the pivot point + SuperTrend combo
# - trend_pullback: Independent copy of capital for the trend-pullback combo
#
# Each profile also has its own `strategy:` block below, letting it tune its
# own moving averages, momentum thresholds, etc. independently of the other
# profiles -- editable per-profile from the dashboard's Edit Settings panel.
# A field a profile doesn't set there falls back to the top-level `strategy:`
# section further down this file.

# Profile selector: which profile to use (52w_high, cross_sectional, consolidation_breakout, or custom name)
# Each profile maintains separate positions, cash, and trade history
# Note: when running all profiles simultaneously (multi-profile mode), this is ignored
active_profile: 52w_high

# Enable multi-profile mode: run all profiles simultaneously in parallel engines
# When disabled, only the active_profile runs; when enabled, all profiles trade concurrently
multi_profile_mode: true

# Profile definitions: each profile can have its own strategy mode, starting capital, and state file
# Each profile is completely independent and can be run standalone or in parallel with others
profiles:
  52w_high:
    display_name: "52-Week High Momentum"
    # Which dashboard tab this profile shows under: "swing" or "long_term".
    category: swing
    # Existing trades stay here - if you have data/state.db, it will be used as the base
    state_file: data/state_52w_high.db
    starting_capital: 100000.0
    # Strategy mode for this profile
    strategy_mode: 52w_high
    # This is your PRIMARY profile where existing trades and positions continue
    strategy:
      proximity_to_52w_high_pct: 4.0
      momentum_lookback_days: 252
      min_momentum_return_pct: 18.0
      fast_ma_days: 50
      slow_ma_days: 200
      min_avg_daily_turnover_inr: 50000000
      min_relative_strength_pct: 8.0
      volume_confirmation:
        enabled: true
        recent_days: 10
        baseline_days: 50
        min_volume_multiple: 1.5
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0

  cross_sectional:
    display_name: "Cross-Sectional Momentum"
    category: swing
    # Fresh ledger independent from 52w_high
    state_file: data/state_cross_sectional.db
    starting_capital: 100000.0
    strategy_mode: cross_sectional_momentum
    # This profile starts fresh with new capital
    strategy:
      fast_ma_days: 50
      slow_ma_days: 200
      min_avg_daily_turnover_inr: 50000000
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0
      cross_sectional:
        lookback_days: 252
        skip_recent_days: 21
        top_pct: 10.0

  consolidation_breakout:
    display_name: "Consolidation Breakout"
    category: swing
    # Fresh ledger independent from 52w_high
    state_file: data/state_consolidation.db
    starting_capital: 100000.0
    strategy_mode: consolidation_breakout
    # This profile starts fresh with new capital
    strategy:
      # Shorter, looser momentum check than 52w_high's -- appropriate for
      # a breakout-off-a-base setup rather than a sustained 52-week trend.
      momentum_lookback_days: 21
      min_momentum_return_pct: 5.0
      fast_ma_days: 50
      slow_ma_days: 200
      min_avg_daily_turnover_inr: 50000000
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0
      consolidation_breakout:
        # How many bars form the base. The base is the N bars BEFORE the
        # latest one; the latest bar is the one that has to break out of it.
        consolidation_days: 10
        # The base counts as "tight" when its high-to-low range is under
        # this percentage of its own average close. 3% is strict for NSE
        # names -- raise it to 4-5% if scans keep reporting base_not_tight
        # for nearly the whole universe.
        max_consolidation_range_pct: 3.0
        # Breakout bar's volume must be at least this multiple of the
        # 20-day average volume of the bars before it.
        volume_multiple: 2.0

  pivot_supertrend:
    display_name: "Pivot Point + SuperTrend"
    category: swing
    # Fresh ledger independent from the other three profiles
    state_file: data/state_pivot_supertrend.db
    starting_capital: 100000.0
    strategy_mode: pivot_supertrend
    # This profile starts fresh with new capital
    strategy:
      min_avg_daily_turnover_inr: 50000000
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0
      pivot_supertrend:
        # Wilder-smoothed ATR window the SuperTrend bands are built on.
        atr_period: 10
        # Band width, in ATRs, either side of the (High+Low)/2 midpoint --
        # the standard SuperTrend default. Wider = fewer, more decisive
        # flips (less whipsaw, later entries); narrower = more, earlier,
        # noisier flips.
        supertrend_multiplier: 3.0
        # A SuperTrend flip alone qualifies at min_pct_above_r1: 0 (any
        # amount above the prior day's R1). Raise this to require the
        # flip to happen with more room above R1, i.e. a more
        # decisively bullish-biased day, not just barely above it.
        min_pct_above_r1: 0.0

  trend_pullback:
    display_name: "Trend Pullback"
    category: swing
    # Fresh ledger independent from the other four profiles
    state_file: data/state_trend_pullback.db
    starting_capital: 100000.0
    strategy_mode: trend_pullback
    # This profile starts fresh with new capital
    strategy:
      # Shorter windows than the 50/200 used by the longer-horizon
      # strategies above -- this strategy buys a shallow dip WITHIN an
      # uptrend, which is a shorter-term read on trend than "above the
      # 200-day average" (that's what the trend_break exit checks
      # instead, via slow_ma_days below).
      fast_ma_days: 20
      slow_ma_days: 50
      min_avg_daily_turnover_inr: 50000000
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0
      trend_pullback:
        # Window used to find the recent high the pullback is measured from.
        pullback_lookback_days: 20
        # Today's close must sit at least this far below that recent high...
        min_pullback_pct: 3.0
        # ...but no more than this far below it -- deeper than this and the
        # uptrend may already be broken rather than just pulling back.
        max_pullback_pct: 12.0

  long_term_trend:
    display_name: "Long Term Trend"
    category: long_term
    # Fresh ledger independent from the other five profiles
    state_file: data/state_long_term_trend.db
    starting_capital: 100000.0
    strategy_mode: long_term_trend
    # This profile starts fresh with new capital
    strategy:
      # Years-long windows, not weeks -- this profile asks "is this stock
      # in a well-established multi-year uptrend?", not "is today a good
      # entry?". fast_ma_days/slow_ma_days here play the same structural
      # role (price > fast > slow) as every other profile's moving
      # averages, just stretched from weeks to years.
      fast_ma_days: 200
      slow_ma_days: 400
      # A real, multi-year return required on top of the trend check --
      # merely sitting above a long average for a year of sideways drift
      # isn't the "already compounding" story this strategy looks for.
      momentum_lookback_days: 252
      min_momentum_return_pct: 12.0
      min_avg_daily_turnover_inr: 50000000
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0
    # Deliberately much wider than the swing profiles' shared risk
    # defaults -- risk is profile-scoped (like strategy) precisely so
    # this profile can tolerate the ordinary volatility of a years-long
    # hold without getting stopped out of what's still a perfectly
    # healthy uptrend. Position sizing stays modest (fewer, longer-held
    # names) rather than the swing profiles' faster-turnover sizing.
    risk:
      stop_loss_pct: 20.0
      trailing_stop_pct: 25.0
      take_profit_pct: 0
      position_size_pct_of_equity: 10.0
      max_open_positions: 8
      max_cash_deployed_per_scan_pct: 40.0
      reentry_cooldown_days: 3

  # ============================================================================
  # CRYPTO TRADING PROFILES
  # ============================================================================
  # These profiles trade ONLY cryptocurrency on 24/7 crypto exchanges.
  # They are COMPLETELY INDEPENDENT from equity profiles:
  #   - Universe: crypto-only symbols (BTC-USD, ETH-USD, etc.), not NSE stocks
  #   - Regime: No Nifty 50 filter; crypto has independent market cycles
  #   - Hours: 24/7 trading (no market open/close checks)
  #   - Regime Index: BTC-USD (if regime ever re-enabled), not Nifty 50
  #
  # NOTE: These profiles use YFinance as fallback for crypto data.
  # For production trading, integrate Binance/Kraken APIs for real-time data.
  # ============================================================================

  crypto_momentum:
    display_name: "Crypto Momentum"
    category: crypto
    state_file: data/state_crypto_momentum.db
    starting_capital: 100000.0
    strategy_mode: crypto_momentum
    # Crypto-only universe. Nothing here touches the NSE equity lists.
    universe_file: data/universe_crypto.csv
    # Crypto has its own market cycles with no reliable Nifty
    # correlation, so the equity regime filter is off entirely. BTC-USD
    # is kept as the crypto-native benchmark for the dashboard's
    # comparison line.
    regime:
      enabled: false
      index_symbol: "BTC-USD"
    strategy:
      # 30 days in a 24/7 market ~= 6 weeks of equity sessions.
      momentum_lookback_days: 30
      min_momentum_return_pct: 5.0
      min_rsi: 50.0                      # RSI > 50 = in a momentum phase
      # In INR, like the rest of this book: crypto quotes arrive from
      # the exchanges in USD and are converted at the live USD/INR rate
      # in the data layer, so the turnover reaching this filter is
      # already rupees. Rs 48cr/day (~$5M) admits the major/mid-caps
      # (LINK, ARB, MKR) while excluding genuinely thin names like GMX.
      min_avg_daily_turnover_inr: 480000000
      max_new_positions_per_scan: 3
    risk:
      stop_loss_pct: 10.0
      trailing_stop_pct: 15.0
      take_profit_pct: 25.0
      position_size_pct_of_equity: 8.0
      max_open_positions: 10
      max_cash_deployed_per_scan_pct: 50.0
      # 24h -- crypto trades continuously, unlike an equity profile's 3-7 days.
      reentry_cooldown_days: 1
    # Crypto exchanges charge a percentage of notional (~0.1% taker),
    # not the flat per-order brokerage+STT an Indian equity broker does.
    execution:
      fee_pct: 0.1
      flat_charges_inr: 0
      slippage_bps: 5.0

  crypto_breakout:
    display_name: "Crypto Breakout"
    category: crypto
    state_file: data/state_crypto_breakout.db
    starting_capital: 100000.0
    strategy_mode: consolidation_breakout
    # Crypto-only universe. Nothing here touches the NSE equity lists.
    universe_file: data/universe_crypto.csv
    # No equity regime filter -- see crypto_momentum above.
    regime:
      enabled: false
      index_symbol: "BTC-USD"
    strategy:
      momentum_lookback_days: 21
      min_momentum_return_pct: 3.0
      # 20/50 rather than an equity profile's 50/200: crypto timeframes
      # are compressed by continuous trading.
      fast_ma_days: 20
      slow_ma_days: 50
      # Rs 48cr/day (~$5M) -- see the note under crypto_momentum above.
      min_avg_daily_turnover_inr: 480000000
      max_new_positions_per_scan: 3
      consolidation_breakout:
        consolidation_days: 7
        max_consolidation_range_pct: 5.0
        volume_multiple: 1.5
    risk:
      stop_loss_pct: 8.0
      trailing_stop_pct: 12.0
      take_profit_pct: 20.0
      position_size_pct_of_equity: 6.0
      max_open_positions: 12
      max_cash_deployed_per_scan_pct: 60.0
      reentry_cooldown_days: 1
    # Percentage exchange fee -- see crypto_momentum above.
    execution:
      fee_pct: 0.1
      flat_charges_inr: 0
      slippage_bps: 5.0

universe:
  file: data/universe_nifty500.csv   # NSE symbols to scan (no .NS suffix). Loaded once at
                                      # startup -- changing this needs a restart to take effect.
                                      # data/universe.csv is a smaller ~100-symbol starter list;
                                      # data/universe_nifty500.csv is the full cleaned Nifty 500.

strategy:
  # Shared base/fallback strategy parameters. Each profile above has its
  # own `strategy:` block that overrides whatever fields it wants to tune
  # independently -- anything a profile doesn't set there falls through
  # to these values. Only matters directly if no profiles are configured
  # at all (legacy non-profile mode) or you add a profile without its own
  # strategy: block.
  #
  # Which strategy drives entry selection (profile.strategy_mode picks
  # this per profile; this `mode` field only matters as the fallback
  # above):
  #   52w_high                 -- accept/reject each stock independently
  #                                against the fixed thresholds below
  #                                (proximity to its own 52-week high,
  #                                an absolute momentum floor, etc).
  #   cross_sectional_momentum -- rank the whole universe by trailing
  #                                return each scan and buy only the top
  #                                percentile ("dual momentum": relative
  #                                strength vs. peers + the regime filter
  #                                below as the absolute-return gate).
  #                                See strategy.cross_sectional below.
  #   consolidation_breakout   -- identify stocks in tight consolidation
  #                                breaking out on strong volume. Requires
  #                                clear uptrend (price > 50/200 DMA).
  #                                See strategy.consolidation_breakout below.
  # All modes share the liquidity, price-range, and trend-confirmation
  # (fast/slow MA) filters, the regime filter, and all exit rules.
  mode: 52w_high
  # A stock qualifies as a BUY candidate when it is trading within this
  # percentage of its 52-week high...
  proximity_to_52w_high_pct: 4.0
  # ...and has delivered at least this much return over the lookback window...
  momentum_lookback_days: 252
  min_momentum_return_pct: 18.0
  # ...and is trading above both moving averages (trend confirmation).
  fast_ma_days: 50
  slow_ma_days: 200
  # Minimum average daily traded value (₹) over the last 20 sessions,
  # used as a liquidity filter so illiquid names are skipped.
  min_avg_daily_turnover_inr: 50000000
  # Relative strength: the stock's own return over momentum_lookback_days
  # must beat the benchmark index's return over the same window by at
  # least this many percentage points -- a stock merely drifting up with
  # a rising market isn't the same signal as one genuinely leading it.
  # Uses regime.index_symbol as the benchmark. Comment out to disable.
  min_relative_strength_pct: 8.0
  # Volume confirmation: require recent trading activity to be running
  # hot relative to the stock's own baseline before treating a move near
  # the 52-week high as a real breakout rather than a quiet drift.
  volume_confirmation:
    enabled: true
    recent_days: 10
    baseline_days: 50
    min_volume_multiple: 1.5
  # How many top-ranked new candidates to buy per scan.
  max_new_positions_per_scan: 3
  # Optional LTP (last traded price) range filter. 0 = no bound on that
  # side. Useful for skipping penny stocks below a floor, or steering
  # clear of very high-priced names that eat too much of a position's
  # share count.
  min_ltp_inr: 0
  max_ltp_inr: 0
  # Only used when strategy.mode is "cross_sectional_momentum" (above).
  cross_sectional:
    # Trailing-return window and the classic "12-1" skip of the most
    # recent month, to avoid short-term reversal noise distorting the
    # cross-sectional ranking. Set skip_recent_days: 0 to disable that
    # and rank on the raw trailing return through the latest close.
    lookback_days: 252
    skip_recent_days: 21
    # Buy only this top percentile of the universe by trailing return
    # (after the liquidity/price-range/trend filters above are applied).
    top_pct: 10.0

  # Only used when strategy.mode is "consolidation_breakout" (above).
  consolidation_breakout:
    # Days to look back to detect a tight consolidation/base.
    consolidation_days: 10
    # Volume multiplier for breakout confirmation.
    # A breakout must occur on volume >= this multiple of the 20-day average.
    volume_multiple: 2.0
    # Phase 2: Screening filters for market cap and beta (to be enabled).
    # market_cap_min_cr: 20000      # Minimum market cap in crores (₹)
    # beta_max: 1.0                 # Maximum beta (volatility filter)
    # index_list: ["NIFTY 50", "NIFTY NEXT 50"]  # Sector leaders only

regime:
  # Market regime filter: momentum strategies get badly hurt trading
  # through a falling market, so only take NEW positions while the
  # broader index itself is in an uptrend. Existing positions still
  # exit normally (stop-loss/trailing-stop/momentum-breakdown) regardless
  # of regime -- this only gates new buys, never risk management.
  # index_symbol is also reused as the benchmark for
  # strategy.min_relative_strength_pct, even if this filter is disabled.
  # NOTE: This filter applies only to equity strategies (52w_high, long_term_trend, etc.)
  # For CRYPTO trading (crypto_momentum, crypto_breakout), this filter has limited
  # relevance since: (1) crypto trades 24/7 independent of NSE hours,
  # (2) Nifty 50 correlation with crypto is weak/unreliable, and
  # (3) crypto has independent market cycles. Consider disabling this
  # filter when running crypto-only strategies: set enabled: false
  enabled: true
  index_symbol: "^NSEI"   # Nifty 50 index (Yahoo Finance ticker)
  ma_days: 200            # index must be trading above this many-day average

risk:
  max_open_positions: 10
  # Fraction of total equity risked/allocated per new position.
  position_size_pct_of_equity: 8.0
  # Hard stop-loss from entry price.
  stop_loss_pct: 7.0
  # Trailing stop from the highest close recorded since entry.
  trailing_stop_pct: 12.0
  # Optional hard take-profit: sell once price is this many percent above
  # entry, regardless of trend. 0 = disabled (the default) -- momentum
  # strategies are usually better served by the trailing stop above
  # ("let winners run") than by capping upside at a fixed target.
  take_profit_pct: 0
  # Exit if price closes below the fast moving average (momentum breakdown).
  exit_below_fast_ma: true
  # Never let a single scan commit more than this fraction of free cash.
  max_cash_deployed_per_scan_pct: 40.0
  # Days after a sell (stop-loss, trailing-stop, or momentum-breakdown)
  # before the same symbol can be bought again. Without this, a stock
  # stopped out on a small dip that still passes the entry filters gets
  # immediately rebought the same scan or the next one -- a whipsaw that
  # looks like the engine buying and selling the same names back-to-back.
  # 0 disables the cooldown.
  reentry_cooldown_days: 5

execution:
  # Simulated slippage applied to paper fills.
  slippage_bps: 5
  # Flat brokerage + STT/charges approximation per executed order (₹).
  flat_charges_inr: 20.0

engine:
  timezone: Asia/Kolkata
  market_open: "09:15"
  market_close: "15:30"
  scan_interval_minutes: 15
  # Recheck exits (stop loss / trailing stop) more frequently than full
  # universe scans for new entries.
  exit_check_interval_minutes: 5
  holidays_file: data/nse_holidays.csv

data_source:
  # "nse" tries the official NSE website API first and falls back to
  # "yfinance" automatically if it is unreachable or blocked. This applies
  # to equity profiles only.
  # CRYPTO profiles (crypto_momentum, crypto_breakout) never go through NSE
  # or this preferred/fallback pair -- MarketDataClient detects crypto
  # symbols (universe entries containing "-", e.g. "BTC-USD") and routes
  # them through a chain of exchanges: Binance first (live 24hr ticker +
  # daily klines), then Kraken if Binance is unreachable or doesn't list
  # the pair, then Yahoo Finance's crypto tickers as the last resort. All
  # of these are public, unauthenticated market-data endpoints -- no API
  # key required. See src/papertrader/data/crypto_client.py.
  preferred: nse
  fallback: yfinance
  request_timeout_seconds: 15
  max_retries: 5

logging:
  file: data/papertrader.log
  level: INFO
