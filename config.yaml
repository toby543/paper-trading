# Configuration for the autonomous NSE momentum paper-trading system.

account:
  starting_capital: 100000.0    # ₹1,00,000 virtual capital
  currency: INR
  state_file: data/state.db     # SQLite file holding cash/positions/trades

universe:
  file: data/universe_nifty500.csv   # NSE symbols to scan (no .NS suffix). Loaded once at
                                      # startup -- changing this needs a restart to take effect.
                                      # data/universe.csv is a smaller ~100-symbol starter list;
                                      # data/universe_nifty500.csv is the full cleaned Nifty 500.

strategy:
  # Which strategy drives entry selection:
  #   52w_high                 -- accept/reject each stock independently
  #                                against the fixed thresholds below
  #                                (proximity to its own 52-week high,
  #                                an absolute momentum floor, etc).
  #   cross_sectional_momentum -- rank the whole universe by trailing
  #                                return each scan and buy only the top
  #                                percentile ("dual momentum": relative
  #                                strength vs. peers + the regime filter
  #                                below as the absolute-return gate).
  #                                See strategy.cross_sectional below.
  # Both modes share the liquidity, price-range, and trend-confirmation
  # (fast/slow MA) filters, the regime filter, and all exit rules.
  mode: 52w_high
  # A stock qualifies as a BUY candidate when it is trading within this
  # percentage of its 52-week high...
  proximity_to_52w_high_pct: 5.0
  # ...and has delivered at least this much return over the lookback window...
  momentum_lookback_days: 90
  min_momentum_return_pct: 15.0
  # ...and is trading above both moving averages (trend confirmation).
  fast_ma_days: 50
  slow_ma_days: 200
  # Minimum average daily traded value (₹) over the last 20 sessions,
  # used as a liquidity filter so illiquid names are skipped.
  min_avg_daily_turnover_inr: 50000000
  # Relative strength: the stock's own return over momentum_lookback_days
  # must beat the benchmark index's return over the same window by at
  # least this many percentage points -- a stock merely drifting up with
  # a rising market isn't the same signal as one genuinely leading it.
  # Uses regime.index_symbol as the benchmark. Comment out to disable.
  min_relative_strength_pct: 5.0
  # Volume confirmation: require recent trading activity to be running
  # hot relative to the stock's own baseline before treating a move near
  # the 52-week high as a real breakout rather than a quiet drift.
  volume_confirmation:
    enabled: true
    recent_days: 10
    baseline_days: 50
    min_volume_multiple: 1.2
  # How many top-ranked new candidates to buy per scan.
  max_new_positions_per_scan: 3
  # Optional LTP (last traded price) range filter. 0 = no bound on that
  # side. Useful for skipping penny stocks below a floor, or steering
  # clear of very high-priced names that eat too much of a position's
  # share count.
  min_ltp_inr: 0
  max_ltp_inr: 0
  # Only used when strategy.mode is "cross_sectional_momentum" (above).
  cross_sectional:
    # Trailing-return window and the classic "12-1" skip of the most
    # recent month, to avoid short-term reversal noise distorting the
    # cross-sectional ranking. Set skip_recent_days: 0 to disable that
    # and rank on the raw trailing return through the latest close.
    lookback_days: 252
    skip_recent_days: 21
    # Buy only this top percentile of the universe by trailing return
    # (after the liquidity/price-range/trend filters above are applied).
    top_pct: 10.0

regime:
  # Market regime filter: momentum strategies get badly hurt trading
  # through a falling market, so only take NEW positions while the
  # broader index itself is in an uptrend. Existing positions still
  # exit normally (stop-loss/trailing-stop/momentum-breakdown) regardless
  # of regime -- this only gates new buys, never risk management.
  # index_symbol is also reused as the benchmark for
  # strategy.min_relative_strength_pct, even if this filter is disabled.
  enabled: true
  index_symbol: "^NSEI"   # Nifty 50 index (Yahoo Finance ticker)
  ma_days: 200            # index must be trading above this many-day average

risk:
  max_open_positions: 10
  # Fraction of total equity risked/allocated per new position.
  position_size_pct_of_equity: 8.0
  # Hard stop-loss from entry price.
  stop_loss_pct: 7.0
  # Trailing stop from the highest close recorded since entry.
  trailing_stop_pct: 10.0
  # Optional hard take-profit: sell once price is this many percent above
  # entry, regardless of trend. 0 = disabled (the default) -- momentum
  # strategies are usually better served by the trailing stop above
  # ("let winners run") than by capping upside at a fixed target.
  take_profit_pct: 0
  # Exit if price closes below the fast moving average (momentum breakdown).
  exit_below_fast_ma: true
  # Never let a single scan commit more than this fraction of free cash.
  max_cash_deployed_per_scan_pct: 40.0
  # Days after a sell (stop-loss, trailing-stop, or momentum-breakdown)
  # before the same symbol can be bought again. Without this, a stock
  # stopped out on a small dip that still passes the entry filters gets
  # immediately rebought the same scan or the next one -- a whipsaw that
  # looks like the engine buying and selling the same names back-to-back.
  # 0 disables the cooldown.
  reentry_cooldown_days: 3

execution:
  # Simulated slippage applied to paper fills.
  slippage_bps: 5
  # Flat brokerage + STT/charges approximation per executed order (₹).
  flat_charges_inr: 20.0

engine:
  timezone: Asia/Kolkata
  market_open: "09:15"
  market_close: "15:30"
  scan_interval_minutes: 15
  # Recheck exits (stop loss / trailing stop) more frequently than full
  # universe scans for new entries.
  exit_check_interval_minutes: 5
  holidays_file: data/nse_holidays.csv

data_source:
  # "nse" tries the official NSE website API first and falls back to
  # "yfinance" automatically if it is unreachable or blocked.
  preferred: nse
  fallback: yfinance
  request_timeout_seconds: 10
  max_retries: 3

logging:
  file: data/papertrader.log
  level: INFO
