# Configuration for the autonomous NSE momentum paper-trading system.

# Configuration for the autonomous NSE momentum paper-trading system.
#
# PROFILE SYSTEM:
# Each profile maintains completely separate positions, cash, and trade history.
# When you switch profiles, you switch to a different ledger and strategy.
#
# - 52w_high: Your primary account (existing trades preserved here)
# - cross_sectional: Independent copy of capital for cross-sectional momentum
# - consolidation_breakout: Independent copy of capital for consolidation breakout
#
# Each profile also has its own `strategy:` block below, letting it tune its
# own moving averages, momentum thresholds, etc. independently of the other
# profiles -- editable per-profile from the dashboard's Edit Settings panel.
# A field a profile doesn't set there falls back to the top-level `strategy:`
# section further down this file.

# Profile selector: which profile to use (52w_high, cross_sectional, consolidation_breakout, or custom name)
# Each profile maintains separate positions, cash, and trade history
# Note: when running all profiles simultaneously (multi-profile mode), this is ignored
active_profile: 52w_high

# Enable multi-profile mode: run all profiles simultaneously in parallel engines
# When disabled, only the active_profile runs; when enabled, all profiles trade concurrently
multi_profile_mode: true

# Profile definitions: each profile can have its own strategy mode, starting capital, and state file
# Each profile is completely independent and can be run standalone or in parallel with others
profiles:
  52w_high:
    display_name: "52-Week High Momentum"
    # Existing trades stay here - if you have data/state.db, it will be used as the base
    state_file: data/state_52w_high.db
    starting_capital: 100000.0
    # Strategy mode for this profile
    strategy_mode: 52w_high
    # This is your PRIMARY profile where existing trades and positions continue
    strategy:
      proximity_to_52w_high_pct: 4.0
      momentum_lookback_days: 252
      min_momentum_return_pct: 18.0
      fast_ma_days: 50
      slow_ma_days: 200
      min_avg_daily_turnover_inr: 50000000
      min_relative_strength_pct: 8.0
      volume_confirmation:
        enabled: true
        recent_days: 10
        baseline_days: 50
        min_volume_multiple: 1.5
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0

  cross_sectional:
    display_name: "Cross-Sectional Momentum"
    # Fresh ledger independent from 52w_high
    state_file: data/state_cross_sectional.db
    starting_capital: 100000.0
    strategy_mode: cross_sectional_momentum
    # This profile starts fresh with new capital
    strategy:
      fast_ma_days: 50
      slow_ma_days: 200
      min_avg_daily_turnover_inr: 50000000
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0
      cross_sectional:
        lookback_days: 252
        skip_recent_days: 21
        top_pct: 10.0

  consolidation_breakout:
    display_name: "Consolidation Breakout"
    # Fresh ledger independent from 52w_high
    state_file: data/state_consolidation.db
    starting_capital: 100000.0
    strategy_mode: consolidation_breakout
    # This profile starts fresh with new capital
    strategy:
      # Shorter, looser momentum check than 52w_high's -- appropriate for
      # a breakout-off-a-base setup rather than a sustained 52-week trend.
      momentum_lookback_days: 21
      min_momentum_return_pct: 5.0
      fast_ma_days: 50
      slow_ma_days: 200
      min_avg_daily_turnover_inr: 50000000
      max_new_positions_per_scan: 3
      min_ltp_inr: 0
      max_ltp_inr: 0
      consolidation_breakout:
        # How many bars form the base. The base is the N bars BEFORE the
        # latest one; the latest bar is the one that has to break out of it.
        consolidation_days: 10
        # The base counts as "tight" when its high-to-low range is under
        # this percentage of its own average close. 3% is strict for NSE
        # names -- raise it to 4-5% if scans keep reporting base_not_tight
        # for nearly the whole universe.
        max_consolidation_range_pct: 3.0
        # Breakout bar's volume must be at least this multiple of the
        # 20-day average volume of the bars before it.
        volume_multiple: 2.0

# Legacy config: used as fallback if active_profile is not recognized or profiles not defined
# If you have an existing state.db, rename it to state_52w_high.db to preserve trades under the 52w_high profile
account:
  starting_capital: 100000.0    # ₹1,00,000 virtual capital
  currency: INR
  state_file: data/state_52w_high.db  # Updated to use profile-specific path (was: data/state.db)

universe:
  file: data/universe_nifty500.csv   # NSE symbols to scan (no .NS suffix). Loaded once at
                                      # startup -- changing this needs a restart to take effect.
                                      # data/universe.csv is a smaller ~100-symbol starter list;
                                      # data/universe_nifty500.csv is the full cleaned Nifty 500.

strategy:
  # Shared base/fallback strategy parameters. Each profile above has its
  # own `strategy:` block that overrides whatever fields it wants to tune
  # independently -- anything a profile doesn't set there falls through
  # to these values. Only matters directly if no profiles are configured
  # at all (legacy non-profile mode) or you add a profile without its own
  # strategy: block.
  #
  # Which strategy drives entry selection (profile.strategy_mode picks
  # this per profile; this `mode` field only matters as the fallback
  # above):
  #   52w_high                 -- accept/reject each stock independently
  #                                against the fixed thresholds below
  #                                (proximity to its own 52-week high,
  #                                an absolute momentum floor, etc).
  #   cross_sectional_momentum -- rank the whole universe by trailing
  #                                return each scan and buy only the top
  #                                percentile ("dual momentum": relative
  #                                strength vs. peers + the regime filter
  #                                below as the absolute-return gate).
  #                                See strategy.cross_sectional below.
  #   consolidation_breakout   -- identify stocks in tight consolidation
  #                                breaking out on strong volume. Requires
  #                                clear uptrend (price > 50/200 DMA).
  #                                See strategy.consolidation_breakout below.
  # All modes share the liquidity, price-range, and trend-confirmation
  # (fast/slow MA) filters, the regime filter, and all exit rules.
  mode: 52w_high
  # A stock qualifies as a BUY candidate when it is trading within this
  # percentage of its 52-week high...
  proximity_to_52w_high_pct: 4.0
  # ...and has delivered at least this much return over the lookback window...
  momentum_lookback_days: 252
  min_momentum_return_pct: 18.0
  # ...and is trading above both moving averages (trend confirmation).
  fast_ma_days: 50
  slow_ma_days: 200
  # Minimum average daily traded value (₹) over the last 20 sessions,
  # used as a liquidity filter so illiquid names are skipped.
  min_avg_daily_turnover_inr: 50000000
  # Relative strength: the stock's own return over momentum_lookback_days
  # must beat the benchmark index's return over the same window by at
  # least this many percentage points -- a stock merely drifting up with
  # a rising market isn't the same signal as one genuinely leading it.
  # Uses regime.index_symbol as the benchmark. Comment out to disable.
  min_relative_strength_pct: 8.0
  # Volume confirmation: require recent trading activity to be running
  # hot relative to the stock's own baseline before treating a move near
  # the 52-week high as a real breakout rather than a quiet drift.
  volume_confirmation:
    enabled: true
    recent_days: 10
    baseline_days: 50
    min_volume_multiple: 1.5
  # How many top-ranked new candidates to buy per scan.
  max_new_positions_per_scan: 3
  # Optional LTP (last traded price) range filter. 0 = no bound on that
  # side. Useful for skipping penny stocks below a floor, or steering
  # clear of very high-priced names that eat too much of a position's
  # share count.
  min_ltp_inr: 0
  max_ltp_inr: 0
  # Only used when strategy.mode is "cross_sectional_momentum" (above).
  cross_sectional:
    # Trailing-return window and the classic "12-1" skip of the most
    # recent month, to avoid short-term reversal noise distorting the
    # cross-sectional ranking. Set skip_recent_days: 0 to disable that
    # and rank on the raw trailing return through the latest close.
    lookback_days: 252
    skip_recent_days: 21
    # Buy only this top percentile of the universe by trailing return
    # (after the liquidity/price-range/trend filters above are applied).
    top_pct: 10.0

  # Only used when strategy.mode is "consolidation_breakout" (above).
  consolidation_breakout:
    # Days to look back to detect a tight consolidation/base.
    consolidation_days: 10
    # Volume multiplier for breakout confirmation.
    # A breakout must occur on volume >= this multiple of the 20-day average.
    volume_multiple: 2.0
    # Phase 2: Screening filters for market cap and beta (to be enabled).
    # market_cap_min_cr: 20000      # Minimum market cap in crores (₹)
    # beta_max: 1.0                 # Maximum beta (volatility filter)
    # index_list: ["NIFTY 50", "NIFTY NEXT 50"]  # Sector leaders only

regime:
  # Market regime filter: momentum strategies get badly hurt trading
  # through a falling market, so only take NEW positions while the
  # broader index itself is in an uptrend. Existing positions still
  # exit normally (stop-loss/trailing-stop/momentum-breakdown) regardless
  # of regime -- this only gates new buys, never risk management.
  # index_symbol is also reused as the benchmark for
  # strategy.min_relative_strength_pct, even if this filter is disabled.
  enabled: true
  index_symbol: "^NSEI"   # Nifty 50 index (Yahoo Finance ticker)
  ma_days: 200            # index must be trading above this many-day average

risk:
  max_open_positions: 10
  # Fraction of total equity risked/allocated per new position.
  position_size_pct_of_equity: 8.0
  # Hard stop-loss from entry price.
  stop_loss_pct: 7.0
  # Trailing stop from the highest close recorded since entry.
  trailing_stop_pct: 12.0
  # Optional hard take-profit: sell once price is this many percent above
  # entry, regardless of trend. 0 = disabled (the default) -- momentum
  # strategies are usually better served by the trailing stop above
  # ("let winners run") than by capping upside at a fixed target.
  take_profit_pct: 0
  # Exit if price closes below the fast moving average (momentum breakdown).
  exit_below_fast_ma: true
  # Never let a single scan commit more than this fraction of free cash.
  max_cash_deployed_per_scan_pct: 40.0
  # Days after a sell (stop-loss, trailing-stop, or momentum-breakdown)
  # before the same symbol can be bought again. Without this, a stock
  # stopped out on a small dip that still passes the entry filters gets
  # immediately rebought the same scan or the next one -- a whipsaw that
  # looks like the engine buying and selling the same names back-to-back.
  # 0 disables the cooldown.
  reentry_cooldown_days: 5

execution:
  # Simulated slippage applied to paper fills.
  slippage_bps: 5
  # Flat brokerage + STT/charges approximation per executed order (₹).
  flat_charges_inr: 20.0

engine:
  timezone: Asia/Kolkata
  market_open: "09:15"
  market_close: "15:30"
  scan_interval_minutes: 15
  # Recheck exits (stop loss / trailing stop) more frequently than full
  # universe scans for new entries.
  exit_check_interval_minutes: 5
  holidays_file: data/nse_holidays.csv

data_source:
  # "nse" tries the official NSE website API first and falls back to
  # "yfinance" automatically if it is unreachable or blocked.
  preferred: nse
  fallback: yfinance
  request_timeout_seconds: 15
  max_retries: 5

logging:
  file: data/papertrader.log
  level: INFO

intelligence:
  # Optional: attach a one-sentence, plain-English rationale to each BUY
  # in the trade log, generated from the numbers the strategy already
  # computed (score, momentum, distance from 52w-high, volume, etc).
  # This NEVER decides or changes a trade -- momentum_52w_high,
  # cross_sectional_momentum and consolidation_breakout still make every
  # buy/sell decision on their own, exactly as before. It only narrates a
  # trade after it has already executed.
  #
  # Requires `pip install anthropic` and an ANTHROPIC_API_KEY environment
  # variable. If either is missing, or the API call fails for any reason
  # (network, rate limit, timeout), the trade still goes through
  # normally -- it just won't have a rationale attached. This costs a
  # small amount per trade once enabled (a handful of buys per scan, not
  # per symbol scanned) -- see intelligence/rationale.py.
  enabled: false
  model: claude-opus-5
  # A slow LLM response must never delay a scan that already computed and
  # executed a real trade -- this timeout applies only to the rationale
  # call, made strictly after the trade is recorded.
  timeout_seconds: 8
