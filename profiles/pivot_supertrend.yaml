display_name: "Pivot Point + SuperTrend"
    # Fresh ledger independent from the other three profiles
state_file: data/state_pivot_supertrend.db
starting_capital: 100000.0
strategy_mode: pivot_supertrend
    # This profile starts fresh with new capital
strategy:
  min_avg_daily_turnover_inr: 50000000
  max_new_positions_per_scan: 3
  min_ltp_inr: 0
  max_ltp_inr: 0
  pivot_supertrend:
        # Wilder-smoothed ATR window the SuperTrend bands are built on.
    atr_period: 10
        # Band width, in ATRs, either side of the (High+Low)/2 midpoint --
        # the standard SuperTrend default. Wider = fewer, more decisive
        # flips (less whipsaw, later entries); narrower = more, earlier,
        # noisier flips.
    supertrend_multiplier: 3.0
        # A SuperTrend flip alone qualifies at min_pct_above_r1: 0 (any
        # amount above the prior day's R1 resistance). Raise this to
        # require the flip to happen with more room above R1, i.e. a more
        # decisively bullish-biased day, not just barely above it.
        # (The knob was documented here as min_pct_above_pivot, a name the
        # strategy never read -- the value below is the real one.)

# Legacy config: used as fallback if active_profile is not recognized or profiles not defined
# If you have an existing state.db, rename it to state_52w_high.db to preserve trades under the 52w_high profile
    min_pct_above_r1: 0.0
category: swing
