display_name: Crypto Breakout Retest
category: crypto
state_file: data/state_crypto_breakout_retest.db
starting_capital: 100000.0
strategy_mode: crypto_breakout_retest
# Crypto-only universe.
universe_file: data/universe_crypto.csv
# Long-only, so new buys are held off while Bitcoin is below its 100-day
# average: back-tested over a year in which BTC fell 28%, this beat no filter
# for every trend/breakout profile (50 days helped none; 200 was weaker than 100).
# Exits still run normally whatever the regime.
regime:
  enabled: true
  index_symbol: "BTC-USD"
  ma_days: 100
strategy:
  min_avg_daily_turnover_inr: 480000000
  max_new_positions_per_scan: 3
  crypto_breakout_retest:
    # Exit only when price is 5% below the breakout level: at 0 any dip
    # under it sold, and 29 of 32 live trades were shaken out within hours.
    retest_exit_buffer_pct: 5.0
    base_lookback_days: 20
    retest_window_days: 10
    # 3% above the base to count as a genuine breakout (not just noise).
    breakout_confirm_pct: 3.0
    # Within 4% of the level counts as retesting it.
    retest_tolerance_pct: 4.0
risk:
  stop_loss_pct: 8.0
  trailing_stop_pct: 12.0
  take_profit_pct: 20.0
  position_size_pct_of_equity: 6.0
  max_open_positions: 10
  max_cash_deployed_per_scan_pct: 40.0
  reentry_cooldown_days: 1
execution:
  fee_pct: 0.1
  flat_charges_inr: 0
  slippage_bps: 5.0
