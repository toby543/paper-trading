display_name: Crypto Trend Pullback
category: crypto
state_file: data/state_crypto_trend_pullback.db
starting_capital: 100000.0
strategy_mode: crypto_trend_pullback
# Crypto-only universe.
universe_file: data/universe_crypto.csv
# Crypto trades 24/7, no NSE session gate. Benchmark is BTC-USD.
# Long-only, so new buys are held off while Bitcoin is below its 100-day
# average: back-tested over a year in which BTC fell 28%, this beat no filter
# for every trend/breakout profile (50 days helped none; 200 was weaker than 100).
# Exits still run normally whatever the regime.
regime:
  enabled: true
  index_symbol: "BTC-USD"
  ma_days: 100
strategy:
  # 20/50 for crypto, matching the other crypto strategies' convention
  # (not the equity default of 50/200).
  fast_ma_days: 20
  slow_ma_days: 50
  # In INR, like the rest of this book. Rs 48cr/day (~$5M) liquidity filter.
  min_avg_daily_turnover_inr: 480000000
  max_new_positions_per_scan: 3
  crypto_trend_pullback:
    pullback_lookback_days: 20
    # Wider than the equity version's 3-20% -- crypto's baseline
    # volatility is 3-4x an NSE stock's even in its calmest names (see
    # the note in crypto_breakout.yaml on max_consolidation_range_pct).
    min_pullback_pct: 5.0
    max_pullback_pct: 20.0
risk:
  stop_loss_pct: 8.0
  trailing_stop_pct: 12.0
  # 2.5x the 8% stop. At 10% it needed a ~45% win rate just to break even;
  # back-tested 20% beat 10%, 16% and no target over the year and recent weeks.
  take_profit_pct: 20.0
  position_size_pct_of_equity: 6.0
  max_open_positions: 10
  max_cash_deployed_per_scan_pct: 40.0
  reentry_cooldown_days: 1
execution:
  fee_pct: 0.1
  flat_charges_inr: 0
  slippage_bps: 5.0
