<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Momentum Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4fb; --surface: #ffffff; --surface-2: #f4f5fa; --border: #e4e5f2;
    --ink: #14162b; --ink-dim: #5c5f7a; --ink-faint: #9396b3;
    --accent: #6d5ef8; --accent-ink: #ffffff; --accent-wash: rgba(109, 94, 248, 0.10);
    --accent-grad: linear-gradient(135deg, #6d5ef8 0%, #a855f7 55%, #ec4899 100%);
    --bad: #e2394b; --bad-wash: rgba(226, 57, 75, 0.09);
    --shadow: 0 1px 2px rgba(30, 20, 90, 0.03), 0 10px 30px rgba(30, 20, 90, 0.06);
    --glow: 0 0 0 1px rgba(109, 94, 248, 0.08), 0 8px 24px rgba(109, 94, 248, 0.16);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a14; --surface: #14152a; --surface-2: #191b34; --border: #2a2c4c;
      --ink: #eef0fb; --ink-dim: #a3a6c9; --ink-faint: #6c6f94;
      --accent: #8b7bff; --accent-ink: #100a2e; --accent-wash: rgba(139, 123, 255, 0.14);
      --accent-grad: linear-gradient(135deg, #8b7bff 0%, #c084fc 55%, #f472b6 100%);
      --bad: #ff6b6b; --bad-wash: rgba(255, 107, 107, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.4);
      --glow: 0 0 0 1px rgba(139, 123, 255, 0.18), 0 8px 28px rgba(139, 123, 255, 0.28);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0a14; --surface: #14152a; --surface-2: #191b34; --border: #2a2c4c;
    --ink: #eef0fb; --ink-dim: #a3a6c9; --ink-faint: #6c6f94;
    --accent: #8b7bff; --accent-ink: #100a2e; --accent-wash: rgba(139, 123, 255, 0.14);
    --accent-grad: linear-gradient(135deg, #8b7bff 0%, #c084fc 55%, #f472b6 100%);
    --bad: #ff6b6b; --bad-wash: rgba(255, 107, 107, 0.12);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.4);
    --glow: 0 0 0 1px rgba(139, 123, 255, 0.18), 0 8px 28px rgba(139, 123, 255, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(900px 500px at 8% -10%, var(--accent-wash), transparent 60%),
      radial-gradient(700px 460px at 100% 10%, rgba(236, 73, 153, 0.08), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }

  .card {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 28px 26px; margin: 20px;
  }
  .mark { font-family: "Inter", sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; margin-bottom: 4px; }
  .mark em { font-style: normal; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 22px; }

  label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }

  button {
    width: 100%; font-family: "Inter", sans-serif; font-size: 13px; font-weight: 700;
    background: var(--accent-grad); color: var(--accent-ink); border: none; border-radius: 999px;
    padding: 11px 18px; cursor: pointer; margin-top: 6px; box-shadow: var(--glow);
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  button:hover { filter: brightness(1.08); transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .error {
    background: var(--bad-wash); color: var(--bad); border-radius: 10px; padding: 9px 12px;
    font-size: 12px; margin-bottom: 16px; line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Momentum <em>Desk</em></div>
    <div class="sub">Sign in to view the dashboard</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% set next_url = request.args.get('next') %}
    <form method="post" action="{{ url_for('login_submit', next=next_url) if next_url else url_for('login_submit') }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
