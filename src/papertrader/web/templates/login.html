<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Momentum Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7f9; --border: #d7dce3;
    --ink: #12161c; --ink-dim: #5b6472; --ink-faint: #8891a0;
    --accent: #a06a1e; --accent-ink: #ffffff; --accent-wash: rgba(160, 106, 30, 0.10);
    --bad: #c5372f; --bad-wash: rgba(197, 55, 47, 0.09);
    --shadow: 0 1px 2px rgba(20, 24, 30, 0.04), 0 8px 24px rgba(20, 24, 30, 0.04);
    --radius: 3px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e14; --surface: #10161f; --surface-2: #161d29; --border: #232c3a;
      --ink: #e8ecf2; --ink-dim: #8791a3; --ink-faint: #59626f;
      --accent: #d4a244; --accent-ink: #16110a; --accent-wash: rgba(212, 162, 68, 0.10);
      --bad: #ef5350; --bad-wash: rgba(239, 83, 80, 0.10);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0e14; --surface: #10161f; --surface-2: #161d29; --border: #232c3a;
    --ink: #e8ecf2; --ink-dim: #8791a3; --ink-faint: #59626f;
    --accent: #d4a244; --accent-ink: #16110a; --accent-wash: rgba(212, 162, 68, 0.10);
    --bad: #ef5350; --bad-wash: rgba(239, 83, 80, 0.10);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; }

  .card {
    width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 26px 24px; margin: 20px;
  }
  .mark { font-family: "Fraunces", ui-serif, Georgia, serif; font-weight: 600; font-size: 21px; letter-spacing: -0.01em; margin-bottom: 4px; }
  .mark em { color: var(--accent); font-style: normal; }
  .sub { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 22px; }

  label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 3px;
    padding: 9px 11px;
  }
  input:focus { outline: none; border-color: var(--accent); }

  button {
    width: 100%; font-family: "IBM Plex Sans", sans-serif; font-size: 13px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 4px;
    padding: 10px 18px; cursor: pointer; margin-top: 4px;
  }
  button:hover { opacity: 0.92; }

  .error {
    background: var(--bad-wash); color: var(--bad); border-radius: 4px; padding: 9px 12px;
    font-size: 12px; margin-bottom: 16px; line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">Momentum <em>Desk</em></div>
    <div class="sub">Sign in to view the dashboard</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% set next_url = request.args.get('next') %}
    <form method="post" action="{{ url_for('login_submit', next=next_url) if next_url else url_for('login_submit') }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="code">Authenticator Code</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
               autocomplete="one-time-code" placeholder="123456" required>
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
